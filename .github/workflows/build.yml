name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  # The trigger-string generator is plain C++ with no Geode dependency, so it
  # can be compiled and tested on a normal runner before spending build minutes
  # on the five platform builds below.
  test:
    name: Test trigger generator
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build and run the host tests
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Isrc \
            tests/object_string_test.cpp src/ObjectString.cpp src/Themes.cpp \
            -o auto-deco-tests
          ./auto-deco-tests

  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest

          - name: macOS
            os: macos-latest

          - name: iOS
            os: macos-latest
            target: iOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    needs: ['test']

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: auto-deco
          path: ${{ steps.build.outputs.build-output }}
